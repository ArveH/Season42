# The BFF's CI: tests on every pull request, and on main a build-push-deploy that the same tests
# gate. Nothing here builds or tests the iOS app — that needs a macOS runner and the code-signing
# setup, which is its own fight.
#
# Fly authentication is an app-scoped deploy token held as a repository secret. Fly offers no
# GitHub OIDC federation for deploys, so unlike the Azure arrangement this replaced there is a
# long-lived credential — scoped to the one app, and to nothing else in the organisation
# (ADR-0015). A pull request cannot read it, and does not try.

name: BFF

on:
  pull_request:
  push:
    branches: [main]
    # An app-only or docs-only commit does not redeploy. fly.toml lives under bff/, so the
    # deployment config is covered by the first entry rather than needing one of its own.
    paths:
      - 'bff/**'
      - 'Season42.slnx'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never a cancelled one: an interrupted deploy can leave the machine
# updated but unreleased. Pull request runs are only tests, so a superseded one is worth cancelling.
concurrency:
  group: bff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # No test reaches the network: the TMDB handler is faked at the composition root, so this
      # needs no token and no Fly.
      - run: dotnet test Season42.slnx

  deploy:
    name: Build, push and deploy
    needs: test
    # Pull requests deploy nothing. They also hold no credential that would let them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      APP_NAME: season42-bff
    steps:
      - uses: actions/checkout@v7

      # Pinned to a major version like every other action here. Fly's own docs say `@master`;
      # `v1` tracks the same commit and does not hand a third party a moving target.
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # The image is built and pushed here rather than by `flyctl deploy` building it, so that the
      # tag is the commit SHA. That tag is what makes the release list mean anything: every release
      # points at an image traceable to a commit, and a rollback is deploying an older tag.
      # `latest` is a convenience and nothing depends on it.
      # The token reaches the steps that need it as an environment variable rather than as a
      # `${{ }}` spliced into the script: a value with a quote or a backtick in it would otherwise
      # become shell. It is not set at job level, so `checkout` never sees it.
      - name: Build and push the image
        id: image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          repository="registry.fly.io/$APP_NAME"
          flyctl auth docker
          docker build -t "$repository:$GITHUB_SHA" -t "$repository:latest" bff
          docker push "$repository:$GITHUB_SHA"
          docker push "$repository:latest"
          echo "reference=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # `--image` deploys the reference just pushed and skips building entirely. The TMDB access
      # token is not passed here: it is a Fly secret set once by hand, because setting one restarts
      # the app and it changes about once a year (ADR-0015).
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          flyctl deploy --config bff/fly.toml --app "$APP_NAME" --image "$IMAGE"
          echo "Deployed $IMAGE to https://$APP_NAME.fly.dev"

      # The deployed BFF answering a real search is the only proof the release is serving. It is
      # given room to be slow: the machine stops when nobody is searching, so this request may be
      # waiting on a cold start and the awaited first TMDB fetch (ADR-0015).
      - name: Ask the deployed BFF for a Watch Provider
        run: |
          set -euo pipefail
          url="https://$APP_NAME.fly.dev/providers?query=net"
          for attempt in $(seq 1 10); do
            # curl writes the status to stdout either way; the fallback is for the exit code,
            # which set -e would otherwise take the whole step down with.
            status=$(curl -sS -o /tmp/providers.json -w '%{http_code}' --max-time 60 "$url") || status=000
            if [ "$status" = "200" ]; then
              cat /tmp/providers.json
              exit 0
            fi
            echo "attempt $attempt: $status — waiting"
            sleep 15
          done
          echo "The deployed BFF never answered $url with 200."
          exit 1
