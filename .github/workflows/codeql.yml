# Code scanning, minus Swift — that one builds the app, so it lives in `codeql-swift.yml` and only
# runs when dispatched (issue #124). This exists as a file rather than as CodeQL's default setup,
# which needs none, for one reason: the Swift analysis has to choose its runner, and default setup
# does not let you. Its workflow is GitHub-hosted at the virtual path
# `dynamic/github-code-scanning/codeql`; there is nothing in the repository to edit (issue #111).
#
# Default setup and this workflow cannot both be configured. Default setup is off; turning it back
# on in Settings makes every run here fail at the upload with "CodeQL analyses from advanced
# configurations cannot be processed when the default setup is enabled".

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Default setup scanned weekly, and a scheduled run is what catches a new query finding something
  # in code that has not changed. Off-peak, because a queue is the one cost a free macOS runner has.
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two that need no build. `none` is CodeQL's buildless extraction: no SDK, no restore, no
  # compile, about a minute each — which is why these can afford to run on every pull request.
  #
  # `actions` scans the workflow files themselves. It is worth more here than it looks: on a public
  # repository anyone can open a pull request, and this is the analysis that reads these files for
  # the ways that goes wrong.
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      # One language failing should not hide another language's findings.
      fail-fast: false
      matrix:
        language: [actions, csharp]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
