<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Mid layer. The only layer allowed to parallax against the mark: a glow that lags the
       thing emitting it is correct. Soft, wide, no hard edge - this is phosphor emission,
       not a painted bloom. -->
  <defs>
    <radialGradient id="phosphorHalo" cx="512" cy="470" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#4AFF4A" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#4AFF4A" stop-opacity="0.14"/>
      <stop offset="0.75" stop-color="#4AFF4A" stop-opacity="0.04"/>
      <stop offset="1"    stop-color="#4AFF4A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#phosphorHalo)"/>
</svg>
